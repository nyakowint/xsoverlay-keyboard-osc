name: Build & Release

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
      - '*.js'
      - '**/*.ps1'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout XSO assemblies
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.xsoRepo }}
          token: ${{ secrets.repoToken }}
          path: refs

      - name: Setup .NET
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: '9.0.x'

      - name: Add Bepis NuGet & Restore dependencies
        run: |
          dotnet nuget add source https://nuget.bepinex.dev/v3/index.json
          dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Read the base version from VERSION file
      - name: Read version
        id: version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-Not (Test-Path VERSION)) { Write-Error "VERSION file not found" }
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { Write-Error "VERSION file is empty" }

          $short = "${{ github.sha }}".Substring(0,7)
          $prerelease = "${{ github.ref_name }}" -ne 'main'

          if ($prerelease) {
            $refs = gh api --paginate "repos/$env:GITHUB_REPOSITORY/git/refs/tags" --jq '.[].ref' 2>$null
            $pattern = '^refs/tags/' + [regex]::Escape($version) + '-pre(\d+)(\+.*)?$'
            $max = 0
            foreach ($r in $refs) {
              if ($r -match $pattern -and [int]$Matches[1] -gt $max) { $max = [int]$Matches[1] }
            }
            $tag = "$version-pre$($max + 1)+$short"
          } else {
            $tag = "$version+$short"
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "Building $tag (prerelease: $prerelease)"

      - name: Create Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $prerelease = "${{ steps.version.outputs.prerelease }}" -eq 'true'
          $branch = "${{ github.ref_name }}"
          $short = "${{ github.sha }}".Substring(0,7)
          $dll = 'builds/Release/net48/KeyboardOSC.dll'
          $cfg = 'BepInEx.cfg'
          if (-not (Test-Path $dll)) { Write-Error "Artifact missing: $dll" }
          if (-not (Test-Path $cfg)) { Write-Error "Artifact missing: $cfg" }

          if (Test-Path CHANGELOG.md) { $notes = Get-Content CHANGELOG.md -Raw } else { $notes = 'Automated build' }

          if ($prerelease) {
            $notes = "Automated build of branch **$branch** at commit $short. Unreleased and possibly " +
                     "unstable, the current stable build is whatever release is marked latest.`n`n---`n`n" + $notes
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesPath -Value $notes -Encoding utf8

          $flags = @('--target', "${{ github.sha }}", '--title', "KeyboardOSC $tag", '--notes-file', $notesPath)
          if ($prerelease) { $flags += '--prerelease' }

          gh release create $tag $dll $cfg @flags || Write-Error 'Release creation failed'
